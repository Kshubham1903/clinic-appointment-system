server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 1. SPA Routing: Serve static assets or fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
        # Prevent browser caching of index.html so code updates show immediately
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 2. Health Check: Forward /api/health to backend container's /health route
    location = /api/health {
        proxy_pass http://backend:5000/health;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. API Proxy: Forward all /api/ requests directly to backend container
    location /api/ {
        # 'backend' matches the service name in docker-compose.yml
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Enable WebSocket/upgrade headers if needed
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}