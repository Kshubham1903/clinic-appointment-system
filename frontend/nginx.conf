server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Map the frontend health-check URL to the backend health endpoint.
    location = /api/health {
        resolver 10.96.0.10 valid=10s ipv6=off;
        set $backend clinic-backend.clinic-appointment.svc.cluster.local;

        proxy_pass http://$backend:5000/health;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Preserve the complete URI for doctors and appointments APIs.
    location /api/ {
        resolver 10.96.0.10 valid=10s ipv6=off;
        set $backend clinic-backend.clinic-appointment.svc.cluster.local;

        proxy_pass http://$backend:5000$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}