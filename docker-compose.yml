services:
  backend:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}/clinic-backend:${IMAGE_TAG:-latest}
    environment:
      MONGO_URI: ${MONGO_URI:?MONGO_URI is required}
      PORT: 5000
    expose:
      - "5000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:5000/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}/clinic-frontend:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    expose:
      - "27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mongo_data: