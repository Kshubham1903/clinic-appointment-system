apiVersion: v1
kind: Service
metadata:
  name: clinic-frontend
  namespace: clinic-appointment
  labels:
    app: clinic-frontend
spec:
  type: ClusterIP
  selector:
    app: clinic-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinic-frontend
  namespace: clinic-appointment
  labels:
    app: clinic-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clinic-frontend
  template:
    metadata:
      labels:
        app: clinic-frontend
    spec:
      containers:
        - name: frontend
          image: clinic-frontend:1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
