apiVersion: v1
kind: Service
metadata:
  name: clinic-backend
  namespace: clinic-appointment
  labels:
    app: clinic-backend
spec:
  type: ClusterIP
  selector:
    app: clinic-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinic-backend
  namespace: clinic-appointment
  labels:
    app: clinic-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clinic-backend
  template:
    metadata:
      labels:
        app: clinic-backend
    spec:
      containers:
        - name: backend
          image: clinic-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: clinic-backend-config
                  key: MONGO_URI
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
